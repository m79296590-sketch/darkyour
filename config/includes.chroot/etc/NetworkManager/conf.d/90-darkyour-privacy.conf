# DarkYour: случайный MAC-адрес, чтобы устройство было сложнее отследить в чужих Wi-Fi сетях
[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=stable
connection.stable-id=${CONNECTION}/${BOOT}

[connectivity]
# не «звонить домой» для проверки интернета
enabled=false
